<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Create your free SonicWave account and start streaming music today." />
  <title>Register – SonicWave</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Orbitron:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --pink: #ff00cc; --purple: #a855f7; --dark: #060610;
      --glass: rgba(255,255,255,0.05); --border: rgba(255,255,255,0.1);
    }
    html, body {
      font-family: 'Outfit', sans-serif;
      background: var(--dark);
      color: #fff;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .auth-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 80px 1rem 1rem;
      position: relative;
    }
    .auth-bg {
      position: fixed;
      inset: 0;
      background-image: url('images/person.jpeg');
      background-size: cover;
      background-position: center;
      filter: brightness(0.4) saturate(1.3);
      z-index: 0;
    }
    .auth-overlay {
      position: fixed;
      inset: 0;
      z-index: 1;
    }

    .auth-card {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 460px;
      background: rgba(10,10,24,0.82);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      border: 1px solid rgba(168,85,247,0.28);
      border-radius: 20px;
      padding: 1.8rem 2rem 1.5rem;
      box-shadow:
        0 0 0 1px rgba(255,0,204,0.06),
        0 0 60px rgba(168,85,247,0.18),
        0 30px 70px rgba(0,0,0,0.55);
      animation: fadeUp 0.5s ease both;
    }
    .auth-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(168,85,247,0.7), rgba(255,0,204,0.7), transparent);
      border-radius: 24px 24px 0 0;
    }

    .auth-logo {
      display: flex; align-items: center; gap: 8px;
      justify-content: center; margin-bottom: 1.2rem;
    }
    .auth-logo-icon {
      width: 40px; height: 40px;
      background: linear-gradient(135deg,rgba(255,0,204,0.15),rgba(168,85,247,0.2));
      border: 1px solid rgba(168,85,247,0.35);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
    }
    .auth-logo-bars { display: flex; align-items: flex-end; gap: 2px; height: 18px; }
    .auth-logo-bars span {
      width: 3px; border-radius: 2px;
      background: linear-gradient(to top, #ff00cc, #a855f7);
    }
    .auth-logo-text {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.25rem; font-weight: 800;
      background: linear-gradient(135deg, #ff00cc, #a855f7);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .auth-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.6rem; font-weight: 800;
      text-align: center; margin-bottom: 0.2rem;
    }
    .auth-sub {
      text-align: center; font-size: 0.85rem;
      color: rgba(255,255,255,0.45); margin-bottom: 1.2rem;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.8rem;
    }
    .form-group { margin-bottom: 0.8rem; }
    .form-group label {
      display: block; font-size: 0.78rem; font-weight: 600;
      color: rgba(255,255,255,0.55); margin-bottom: 0.3rem;
      letter-spacing: 0.5px; text-transform: uppercase;
    }
    .form-group input {
      width: 100%; padding: 10px 14px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(168,85,247,0.25);
      border-radius: 10px; color: #fff;
      font-size: 0.9rem; font-family: 'Outfit', sans-serif;
      outline: none; transition: border-color 0.3s, box-shadow 0.3s;
    }
    .form-group input:focus {
      border-color: rgba(168,85,247,0.7);
      box-shadow: 0 0 18px rgba(168,85,247,0.18);
    }
    .form-group input::placeholder { color: rgba(255,255,255,0.25); }

    /* Password strength */
    .strength-bar {
      height: 4px; border-radius: 4px;
      background: rgba(255,255,255,0.08);
      margin-top: 8px; overflow: hidden;
    }
    .strength-fill {
      height: 100%; border-radius: 4px;
      width: 0%; transition: width 0.4s, background 0.4s;
    }
    .strength-label {
      font-size: 0.75rem; color: rgba(255,255,255,0.4);
      margin-top: 4px; text-align: right;
    }

    /* Terms */
    .terms-check {
      display: flex; align-items: flex-start;
      gap: 8px; margin: 0.8rem 0 1rem;
      font-size: 0.8rem; color: rgba(255,255,255,0.5);
    }
    .terms-check input[type="checkbox"] {
      width: 16px; height: 16px; margin-top: 2px;
      accent-color: var(--pink); cursor: pointer;
    }
    .terms-check a { color: var(--pink); text-decoration: none; }
    .terms-check a:hover { color: var(--purple); }

    .btn-auth {
      width: 100%; padding: 11px;
      background: linear-gradient(135deg, #ff00cc, #7b2ff7);
      border: none; border-radius: 10px; color: #fff;
      font-size: 0.95rem; font-weight: 700;
      font-family: 'Outfit', sans-serif; cursor: pointer;
      box-shadow: 0 0 20px rgba(255,0,204,0.4), 0 6px 20px rgba(123,47,247,0.3);
      transition: transform 0.2s, box-shadow 0.3s; letter-spacing: 0.5px;
    }
    .btn-auth:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 35px rgba(255,0,204,0.6), 0 10px 30px rgba(123,47,247,0.4);
    }

    .auth-divider {
      display: flex; align-items: center; gap: 10px;
      margin: 1.2rem 0; color: rgba(255,255,255,0.2); font-size: 0.75rem;
    }
    .auth-divider::before, .auth-divider::after {
      content: ''; flex: 1; height: 1px; background: rgba(255,255,255,0.1);
    }

    .auth-switch {
      text-align: center; font-size: 0.85rem;
      color: rgba(255,255,255,0.5); margin-top: 0.8rem;
    }
    .auth-switch a {
      color: var(--pink); font-weight: 600;
      text-decoration: none; transition: color 0.2s;
    }
    .auth-switch a:hover { color: var(--purple); }

    @keyframes fadeUp {
      from { opacity:0; transform:translateY(20px); }
      to   { opacity:1; transform:translateY(0); }
    }

    @media (max-width: 480px) {
      .auth-card { padding: 1.5rem 1.25rem; }
      .auth-page { padding: 70px 0.75rem 1rem; }
      .auth-logo span { font-size: 1.25rem; }
    }
    @media (max-width: 380px) {
      .auth-card { padding: 1.25rem 1rem; border-radius: 16px; }
      .auth-title { font-size: 1.4rem; }
    }
  </style>
</head>
<body>

  <div class="auth-bg"></div>
  <div class="auth-overlay"></div>

  <!-- NAVBAR (identical across all pages) -->
  <nav class="navbar" id="mainNavbar">
    <div class="nav-inner">
      <a href="index.html" class="logo">
        <div class="logo-icon-wrap">
          <div class="logo-bars">
            <div class="logo-bar"></div><div class="logo-bar"></div>
            <div class="logo-bar"></div><div class="logo-bar"></div>
            <div class="logo-bar"></div>
          </div>
        </div>
        SonicWave
      </a>
      <ul class="nav-links" id="mainNavLinks">
        <li><a href="index.html">Home</a></li>
        <li><a href="explore.html">Explore</a></li>
        <li><a href="categories.html">Categories</a></li>
        <li><a href="player.html">Player</a></li>
      </ul>
      <div class="nav-right">
        <a href="explore.html" class="nav-search-btn" title="Search">🔍</a>
        <div class="nav-sep"></div>
        <a href="login.html" class="nav-cta active">
          <span class="nav-cta-dot"></span>Login / Signup
        </a>
        <div class="hamburger" id="hamburgerBtn" onclick="toggleMobileNav()">
          <span></span><span></span><span></span>
        </div>
      </div>
    </div>
  </nav>

  <!-- REGISTER FORM -->
  <div class="auth-page">
    <div class="auth-card">

      <div class="auth-logo">
        <div class="auth-logo-icon">
          <div class="auth-logo-bars">
            <span style="height:8px"></span>
            <span style="height:14px"></span>
            <span style="height:18px"></span>
            <span style="height:11px"></span>
            <span style="height:6px"></span>
          </div>
        </div>
        <span class="auth-logo-text">SonicWave</span>
      </div>

      <h1 class="auth-title">Create Account</h1>
      <p class="auth-sub">Join millions of music lovers today</p>

      <form id="registerForm" action="#" method="POST" onsubmit="handleRegister(event)">

        <!-- First & Last name row -->
        <div class="form-row">
          <div class="form-group">
            <label for="regFirst">First Name</label>
            <input id="regFirst" type="text" name="firstname" placeholder="" required />
          </div>
          <div class="form-group">
            <label for="regLast">Last Name</label>
            <input id="regLast" type="text" name="lastname" placeholder="" required />
          </div>
        </div>

        <div class="form-group">
          <label for="regEmail">Email Address</label>
          <input id="regEmail" type="email" name="email" placeholder="you@example.com" required />
        </div>

        <div class="form-group">
          <label for="regUsername">Username</label>
          <input id="regUsername" type="text" name="username" placeholder="@sonicfan" required />
        </div>

        <div class="form-group">
          <label for="regPassword">Password</label>
          <input id="regPassword" type="password" name="password" placeholder="At least 8 characters" required oninput="checkStrength(this.value)" />
          <div class="strength-bar"><div class="strength-fill" id="strengthFill"></div></div>
          <div class="strength-label" id="strengthLabel">Enter a password</div>
        </div>

        <div class="form-group">
          <label for="regConfirm">Confirm Password</label>
          <input id="regConfirm" type="password" name="confirm" placeholder="Re-enter your password" required />
        </div>

        <label class="terms-check">
          <input type="checkbox" id="termsCheck" required />
          <span>I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a></span>
        </label>

        <button type="submit" class="btn-auth">Create Account ➔</button>
      </form>

      <div class="auth-divider">or</div>

      <div class="auth-switch">
        Already have an account? <a href="login.html">Sign In</a>
      </div>
    </div>
  </div>

  <script src="js/script.js"></script>
  <script>
    function checkStrength(val) {
      const fill = document.getElementById('strengthFill');
      const label = document.getElementById('strengthLabel');
      let score = 0;
      if (val.length >= 8)  score++;
      if (/[A-Z]/.test(val)) score++;
      if (/[0-9]/.test(val)) score++;
      if (/[^A-Za-z0-9]/.test(val)) score++;
      const pct  = (score / 4) * 100;
      const colors = ['#ef4444','#f97316','#eab308','#22c55e'];
      const labels = ['Weak','Fair','Good','Strong'];
      fill.style.width = pct + '%';
      fill.style.background = colors[score - 1] || '#ef4444';
      label.textContent = val.length === 0 ? 'Enter a password' : labels[score - 1] || 'Weak';
    }

    function handleRegister(e) {
      e.preventDefault();
      const pass = document.getElementById('regPassword').value;
      const conf = document.getElementById('regConfirm').value;
      if (pass !== conf) {
        alert('Passwords do not match!');
        return;
      }
      const btn = document.querySelector('.btn-auth');
      btn.textContent = 'Creating account…';
      btn.style.opacity = '0.7';
      setTimeout(() => {
        alert('Account created! Welcome to SonicWave 🎵');
        window.location.href = 'login.html';
      }, 1200);
    }
  </script>
</body>
</html>
